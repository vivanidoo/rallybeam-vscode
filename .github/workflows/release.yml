name: Release

# Builds the .vsix once, in public, and publishes that same file to the VS Code Marketplace and to Open VSX, so
# anyone can see that the published extension comes from this code.
#
# Both stores take it through trusted publishing: GitHub vouches for this workflow (OIDC) and the store's trusted
# publisher entry for it accepts that, so no store token is stored. Each store is skipped until its repository variable,
# MARKETPLACE_TRUSTED_PUBLISHING or OPEN_VSX_TRUSTED_PUBLISHING, is "true", set once its entry exists.
#
# Safe to run again for the same version and commit, for example after one store failed: the GitHub release is kept
# (its file is replaced), and a store that already has the version is skipped. A release that exists for another commit
# stops the run, because a version is published once; bump the version in package.json.
on:
  workflow_dispatch:
    inputs:
      pre-release:
        description: Publish as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

env:
  PRE_RELEASE: ${{ inputs.pre-release && '--pre-release' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package
        run: |
          node scripts/notices.mjs
          node esbuild.mjs --production
          npx vsce package --no-dependencies $PRE_RELEASE --out rallybeam.vsix
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rallybeam-vsix
          path: rallybeam.vsix

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rallybeam-vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG already exists for commit $TAG_SHA, not $GITHUB_SHA. Bump the version in package.json, or delete the release and its tag first."
              exit 1
            fi
            gh release upload "$TAG" rallybeam.vsix --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" rallybeam.vsix --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --generate-notes --target "$GITHUB_SHA" ${{ inputs.pre-release && '--prerelease' || '' }}
          fi

  # Only this job may ask GitHub for the identity the Marketplace trusts, and it runs nothing of the project's own
  # dependencies: just the built file and the publishing tool, at a fixed version.
  marketplace:
    needs: [build, github-release]
    if: vars.MARKETPLACE_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: rallybeam-vsix
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc --no-dependencies --skip-duplicate --packagePath rallybeam.vsix $PRE_RELEASE

  # The same for Open VSX, whose namespace owner registers this workflow as a trusted publisher.
  open-vsx:
    needs: [build, github-release]
    if: vars.OPEN_VSX_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: rallybeam-vsix
      - run: npx --yes ovsx@1.3.0 publish rallybeam.vsix --trusted-publishing --skip-duplicate $PRE_RELEASE
